# One pull request per ecosystem per month, against dev: every update for that ecosystem
# is grouped into a single PR, so CI runs once on the combined change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns: ['*']
    ignore:
      # Pinned to the browser preinstalled in cloud sessions; see CLAUDE.md, section 11.
      - dependency-name: playwright

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ['*']
