# Day-to-day work: every push to dev (and to any working branch), and every pull request,
# runs all checks. main runs the same checks in release.yml.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
