# Every push to main runs all checks. Render deploys main only after the checks on the
# commit pass (its Auto-Deploy setting "After CI Checks Pass"), so a failing check keeps
# the live site as it is. Tagging happens later, in tag.yml, once the new version is live.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
