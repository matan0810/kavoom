# Render blueprint: one free web service that serves the site and the online rooms.
services:
  - type: web
    name: kavoom
    runtime: node
    plan: free
    branch: main # production only; dev never deploys
    region: frankfurt # fixed when the service is created; see README
    buildCommand: npm ci --include=dev && npm run build # dev packages hold the build tool
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
